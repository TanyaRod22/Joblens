<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Joblens</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-shell">
    <header class="popup-header">
      <div class="popup-brand">
        <div class="popup-logo">JS</div>
        <h1>Joblens</h1>
      </div>
    </header>

    <main class="popup-main">
      <p class="popup-copy">Open a job posting and use the side panel to scan and analyze the role.</p>
      <button type="button" class="popup-btn" id="open-panel">Open Panel</button>
      <button type="button" class="popup-btn popup-btn-primary" id="scan-job">Scan Job</button>
    </main>
  </div>
  <script src="popup.js"></script>
</body>
</html>
